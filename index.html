<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Status Viewer - Ultimate Pro Edition</title>
  <style>
    :root {
      --wa-green: #25d366;
      --wa-bg: #070d12;
      --wa-card: #111b21;
      --wa-border: #26353f;
      --wa-text-main: #f1f5f8;
      --wa-text-secondary: #aab8c2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--wa-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Container replicating mobile screen */
    .status-card {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      max-height: 870px;
      background-color: var(--wa-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      color: var(--wa-text-main);
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
    }

    /* Top Progress Bar */
    .progress-container {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      height: 2px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      z-index: 10;
    }
    .progress-bar {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 2px;
    }

    /* Header */
    .header {
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      font-size: 22px;
      cursor: pointer;
      color: #ffffff;
      transition: opacity 0.2s;
    }
    .back-btn:hover {
      opacity: 0.8;
    }
    .profile-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #202c33;
      border: 2px solid var(--wa-green);
    }
    .status-meta .title {
      font-size: 16px;
      font-weight: 500;
      color: #ffffff;
    }
    .status-meta .subtitle {
      font-size: 12px;
      color: var(--wa-text-secondary);
    }
    .header-menu {
      font-size: 20px;
      cursor: pointer;
      color: #ffffff;
    }

    /* Story Media Section */
    .media-container {
      width: 100%;
      height: 40%;
      position: relative;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    .story-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Floating Pill Badge */
    .pill-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(17, 27, 33, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 16px 8px 10px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--wa-text-main);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .pill-badge:hover {
      background: rgba(24, 37, 46, 0.95);
      transform: translate(-50%, -50%) scale(1.02);
      border-color: rgba(37, 211, 102, 0.4);
    }
    .pill-avatars {
      display: flex;
      align-items: center;
    }
    .pill-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #111b21;
      margin-left: -8px;
    }
    .pill-avatar:first-child {
      margin-left: 0;
    }

    /* Viewers Bottom Sheet */
    .viewers-sheet {
      flex: 1;
      background-color: var(--wa-bg);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 0 -4px 25px rgba(0,0,0,0.95);
      margin-top: -10px;
      min-height: 0;
      overflow: visible;
    }
    .sheet-header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--wa-border);
      position: relative;
      background-color: var(--wa-bg);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      flex-shrink: 0;
    }
    .view-count {
      font-size: 15px;
      font-weight: 500;
      color: var(--wa-text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sheet-actions {
      display: flex;
      gap: 14px;
      align-items: center;
      position: relative;
    }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      color: var(--wa-text-secondary);
      transition: color 0.2s;
    }
    .icon-btn:hover {
      color: var(--wa-text-main);
    }

    /* Popup Card Menu */
    .popup-menu {
      position: absolute;
      top: -62px;
      right: 0;
      background-color: var(--wa-card);
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.95);
      border: none;
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 9999;
    }
    .popup-menu.active {
      display: flex;
    }
    .popup-item {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      color: var(--wa-text-secondary);
      transition: color 0.2s;
    }
    .popup-item:hover {
      color: var(--wa-green);
    }

    /* List Items & Scroll */
    .viewers-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #26353f transparent;
      padding-bottom: 20px;
    }
    .viewers-list::-webkit-scrollbar {
      width: 5px;
    }
    .viewers-list::-webkit-scrollbar-thumb {
      background-color: #26353f;
      border-radius: 10px;
    }

    .viewer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: var(--wa-bg);
      transition: background-color 0.15s;
    }
    .viewer-item:active {
      background-color: #111b21;
    }
    .viewer-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Avatar with Segmented WhatsApp Status Rings */
    .avatar-wrapper {
      position: relative;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .story-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 48px;
      height: 48px;
      filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.5));
    }
    .viewer-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #202c33;
    }

    .heart-badge {
      position: absolute;
      bottom: -1px;
      right: -1px;
      background-color: var(--wa-bg);
      border-radius: 50%;
      padding: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .viewer-name {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 2px;
      color: var(--wa-text-main);
    }
    .viewer-time {
      font-size: 12px;
      color: var(--wa-text-secondary);
    }
    .viewer-comment {
      font-size: 11.5px;
      color: #7c909d;
      margin-top: 3px;
      direction: ltr;
      font-weight: 400;
    }
    .viewer-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body>

  <div class="status-card">
    <!-- Progress Indicator -->
    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>

    <!-- Header Navigation -->
    <div class="header">
      <div class="header-left">
        <span class="back-btn">&larr;</span>
        <img src="my-avatar.jpg" class="profile-avatar" id="myAvatar" alt="Me">
        <div class="status-meta">
          <div class="title">My status</div>
          <div class="subtitle">Yesterday, 1:34 pm</div>
        </div>
      </div>
      <div class="header-menu">&#8942;</div>
    </div>

    <!-- Story Main Image -->
    <div class="media-container">
      <img src="story.jpg" class="story-image" id="storyImg" alt="Status Story">
      
      <!-- See more statuses badge with 3 local images -->
      <div class="pill-badge">
        <div class="pill-avatars">
          <img src="status1.jpg" class="pill-avatar" alt="Status 1">
          <img src="status2.jpg" class="pill-avatar" alt="Status 2">
          <img src="status3.jpg" class="pill-avatar" alt="Status 3">
        </div>
        <span>See more statuses</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </div>
    </div>

    <!-- Viewers Bottom Sheet -->
    <div class="viewers-sheet">
      <div class="sheet-header">
        <div class="view-count">
          <span>Viewed by 423</span>
          <span style="display: flex; align-items: center; gap: 6px; margin-left: 6px; font-weight: normal; font-size: 15px; color: var(--wa-text-main);">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#25d366" stroke="#ffffff" stroke-width="2"/>
            </svg>
            367
          </span>
        </div>

        <div class="sheet-actions">
          <!-- Facebook Icon -->
          <button class="icon-btn" title="Facebook">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="var(--wa-text-main)">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
          </button>

          <!-- Instagram Icon -->
          <button class="icon-btn" title="Instagram">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="var(--wa-text-main)">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
          </button>

          <!-- TikTok Icon -->
          <button class="icon-btn" title="TikTok">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="var(--wa-text-main)">
              <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
            </svg>
          </button>

          <!-- Three Dots Menu Button -->
          <button class="icon-btn" id="menuToggleBtn" title="More options">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="var(--wa-text-main)">
              <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
          </button>

          <!-- Popup Card Menu -->
          <div class="popup-menu" id="popupMenu">
            <button class="popup-item" title="IP Info">
              <span style="font-size: 10px; font-weight: 700; color: var(--wa-green); background: rgba(37,211,102,0.15); padding: 2px 4px; border-radius: 4px;">IP</span>
            </button>
            <button class="popup-item" title="Network / Globe">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="var(--wa-text-main)"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm7.93 6h-2.85a15.86 15.86 0 0 0-1.58-4.14A8.04 8.04 0 0 1 19.93 8zM12 4.05c1.32 1.63 2.2 3.65 2.53 5.95H9.47c.33-2.3 1.21-4.32 2.53-5.95zM4.07 10h2.85c-.15 1.34-.15 2.66 0 4H4.07a8.04 8.04 0 0 1-.57-4zm2.28-6a15.86 15.86 0 0 0 1.58 4.14A8.04 8.04 0 0 1 4.07 8h2.28zM12 19.95c-1.32-1.63-2.2-3.65-2.53-5.95h5.06c-.33 2.3-1.21 4.32-2.53 5.95zm3.78-7.95H8.22c-.14-.66-.22-1.33-.22-2s.08-1.34.22-2h7.56c.14.66.22 1.33.22 2s-.08 1.34-.22 2zm.37 7.86A15.86 15.86 0 0 0 17.65 16h2.28a8.04 8.04 0 0 1-1.78 3.86zM17.65 8a15.86 15.86 0 0 0-1.5-4.14A8.04 8.04 0 0 1 19.93 8h-2.28z"/></svg>
            </button>
            <button class="popup-item" title="Mobile View">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="var(--wa-text-main)"><path d="M17 1H7c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm0 18H7V5h10v14zM12 20c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
            </button>
            <button class="popup-item" title="Airplane Flight">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="var(--wa-text-main)"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
            </button>
            <button class="popup-item" title="Desktop">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="var(--wa-text-main)"><path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7v2H8v2h8v-2h-2v-2h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v12z"/></svg>
            </button>
          </div>

        </div>
      </div>

      <!-- قائمة المشاهدين -->
      <div class="viewers-list" id="viewersList"></div>
    </div>
  </div>

  <script>
    const viewersData = [
      { name: "Sin Ca", time: "Yesterday, 6:35 pm", dashArray: "30 6", liked: true, comment: "Код работает, ты легенда! 🚀 (Awesome code!)" },
      { name: "A Eltrabily", time: "Yesterday, 5:49 pm", dashArray: "18 5", liked: true, comment: "Чистый синтаксис, браво! 🔥 (Clean syntax!)" },
      { name: "Hamed", time: "Yesterday, 5:10 pm", dashArray: "12 4", liked: true, comment: "Моя вечная инвестиция 💎 (My eternal investment)" },
      { name: "Sick", time: "Yesterday, 2:06 pm", dashArray: "8 3", liked: true, comment: "Что это за магия?! 💻 (What is this magic?!)" },
      { name: "Mika", time: "Yesterday, 1:58 pm", dashArray: "22 5", liked: true, comment: "Ты просто гений программирования! ⭐ (Absolute genius!)" },
      { name: "Youssef", time: "Yesterday, 1:12 pm", dashArray: "14 4", liked: true, comment: "Легендарный проект! ⚡ (Legendary project!)" },
      { name: "Omar Nabil", time: "Yesterday, 12:45 pm", dashArray: "45 8", liked: false, comment: "Лучший код всех времен! 🛠️ (Best code ever!)" },
      { name: "Aya Mohamed", time: "Yesterday, 11:30 am", dashArray: "10 4", liked: true, comment: "Шедевр инженерии! ❤️ (Engineering masterpiece!)" }
    ];

    const container = document.getElementById('viewersList');
    
    viewersData.forEach((person, index) => {
      const item = document.createElement('div');
      item.className = 'viewer-item';

      const avatarFileName = `viewer${index + 1}.jpg`;

      const heartBadgeSvg = person.liked ? `
        <div class="heart-badge">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#25d366" stroke="#ffffff" stroke-width="2"/>
          </svg>
        </div>` : '';

      const actionsHtml = `
        <div style="display: flex; align-items: center; gap: 12px;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="var(--wa-text-secondary)">
            <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
          </svg>
        </div>`;

      item.innerHTML = `
        <div class="viewer-info">
          <div class="avatar-wrapper">
            <svg class="story-ring" viewBox="0 0 50 50">
              <circle cx="25" cy="25" r="21.5" fill="none" stroke="#26353f" stroke-width="3.2"/>
              <circle cx="25" cy="25" r="21.5" fill="none" stroke="var(--wa-green)" stroke-width="3.2" stroke-dasharray="${person.dashArray}" stroke-linecap="round"/>
            </svg>
            <img src="${avatarFileName}" class="viewer-avatar" alt="${person.name}">
            ${heartBadgeSvg}
          </div>
          <div>
            <div class="viewer-name">${person.name}</div>
            <div class="viewer-time">${person.time}</div>
            <div class="viewer-comment">${person.comment}</div>
          </div>
        </div>
        <div class="viewer-actions">
          ${actionsHtml}
        </div>
      `;
      container.appendChild(item);
    });

    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const popupMenu = document.getElementById('popupMenu');

    menuToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      popupMenu.classList.toggle('active');
    });

    window.addEventListener('click', () => {
      if (popupMenu.classList.contains('active')) {
        popupMenu.classList.remove('active');
      }
    });
  </script>
</body>
</html>
