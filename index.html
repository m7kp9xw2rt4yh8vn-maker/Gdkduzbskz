<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Status Viewers</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b141a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Container replicating mobile screen */
    .status-card {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      max-height: 870px;
      background-color: #111b21;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      color: #e9edef;
    }

    /* Header matching your exact reference image */
    .sheet-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #111b21;
      border-bottom: 1px solid #222d34;
      position: relative;
      z-index: 20;
    }

    .view-count {
      font-size: 18px;
      font-weight: 500;
      color: #e9edef;
    }

    .sheet-actions {
      display: flex;
      gap: 20px;
      align-items: center;
      position: relative;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: #8696a0;
    }
    .icon-btn:hover {
      color: #e9edef;
    }

    /* Popup Menu (Icons only without text) */
    .popup-menu {
      position: absolute;
      top: 40px;
      right: 0;
      background-color: #233138;
      border-radius: 12px;
      padding: 8px 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.08);
      display: none;
      align-items: center;
      gap: 14px;
      z-index: 100;
    }
    .popup-menu.active {
      display: flex;
    }
    .popup-item {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      color: #8696a0;
      transition: color 0.2s;
    }
    .popup-item:hover {
      color: #00a884;
    }

    /* Viewers List (Scrollable with zero bottom gap) */
    .viewers-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #222d34 transparent;
      background-color: #111b21;
    }
    .viewers-list::-webkit-scrollbar {
      width: 4px;
    }
    .viewers-list::-webkit-scrollbar-thumb {
      background-color: #222d34;
      border-radius: 10px;
    }

    .viewer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      transition: background 0.2s;
    }
    .viewer-item:active {
      background-color: #202c33;
    }

    .viewer-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Avatar with dynamic segmented story rings */
    .avatar-container {
      position: relative;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .story-ring {
      position: absolute;
      width: 50px;
      height: 50px;
      transform: rotate(-90deg);
    }

    .story-ring circle {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .viewer-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #202c33;
      z-index: 2;
    }

    .viewer-name {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 3px;
      color: #e9edef;
    }
    .viewer-time {
      font-size: 13px;
      color: #8696a0;
    }

    .viewer-actions {
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="status-card">
    <!-- Header -->
    <div class="sheet-header">
      <div class="view-count" id="viewCount">Viewed by 8</div>
      <div class="sheet-actions">
        <!-- Instagram Icon -->
        <button class="icon-btn" title="Instagram">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#8696a0">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </button>

        <!-- Three Dots Menu Button -->
        <button class="icon-btn" id="menuToggleBtn" title="More options">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#8696a0">
            <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
        </button>

        <!-- Popup Menu (Icons Only) -->
        <div class="popup-menu" id="popupMenu">
          <button class="popup-item" title="IP Info">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="#00a884"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
          </button>
          <button class="popup-item" title="Network">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="#8696a0"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          </button>
          <button class="popup-item" title="Mobile View">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="#8696a0"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
          </button>
          <button class="popup-item" title="Desktop">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="#8696a0"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Viewers List -->
    <div class="viewers-list" id="viewersList"></div>
  </div>

  <script>
    // عدد الستوريات مختلف لكل شخص (من 1 إلى 7)
    const viewersData = [
      { name: "Sin Ca", time: "Yesterday, 6:35 pm", avatar: "viewer1.jpg", stories: 3 },
      { name: "A Eltrabily", time: "Yesterday, 5:49 pm", avatar: "viewer2.jpg", stories: 5 },
      { name: "Hamed", time: "Yesterday, 5:10 pm", avatar: "viewer3.jpg", stories: 1 },
      { name: "Sick", time: "Yesterday, 2:06 pm", avatar: "viewer4.jpg", stories: 7 },
      { name: "Mika", time: "Yesterday, 1:58 pm", avatar: "viewer5.jpg", stories: 4 },
      { name: "Youssef", time: "Yesterday, 1:12 pm", avatar: "viewer6.jpg", stories: 2 },
      { name: "Omar Nabil", time: "Yesterday, 12:45 pm", avatar: "viewer7.jpg", stories: 6 },
      { name: "Aya Mohamed", time: "Yesterday, 11:30 am", avatar: "viewer8.jpg", stories: 3 }
    ];

    const container = document.getElementById('viewersList');
    document.getElementById('viewCount').innerText = `Viewed by ${viewersData.length}`;

    viewersData.forEach(person => {
      const item = document.createElement('div');
      item.className = 'viewer-item';

      // حساب التقسيم المتقطع للحلقة بناءً على عدد الستوريات لكل شخص
      const circumference = 2 * Math.PI * 22;
      const count = person.stories;
      const dashLength = (circumference / count) * 0.75;
      const gapLength = (circumference / count) * 0.25;

      const chatSvg = `
        <svg viewBox="0 0 24 24" width="22" height="22" fill="#8696a0">
          <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
        </svg>`;

      item.innerHTML = `
        <div class="viewer-info">
          <div class="avatar-container">
            <svg class="story-ring" viewBox="0 0 50 50">
              <circle cx="25" cy="25" r="22" 
                stroke="#00a884" 
                stroke-dasharray="${dashLength} ${gapLength}" />
            </svg>
            <img src="${person.avatar}" class="viewer-avatar" alt="${person.name}">
          </div>
          <div>
            <div class="viewer-name">${person.name}</div>
            <div class="viewer-time">${person.time}</div>
          </div>
        </div>
        <div class="viewer-actions">
          ${chatSvg}
        </div>
      `;
      container.appendChild(item);
    });

    // إظهار وإخفاء القائمة المنسقّة عند الضغط على الثلاث نقاط
    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const popupMenu = document.getElementById('popupMenu');

    menuToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      popupMenu.classList.toggle('active');
    });

    window.addEventListener('click', () => {
      if (popupMenu.classList.contains('active')) {
        popupMenu.classList.remove('active');
      }
    });
  </script>
</body>
</html>
