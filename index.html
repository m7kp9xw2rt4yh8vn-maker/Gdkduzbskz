<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Status Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Container replicating mobile screen */
    .status-card {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      max-height: 870px;
      background-color: #111b21;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      color: #e9edef;
    }

    /* Top Progress Bar */
    .progress-container {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      height: 2px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      z-index: 10;
    }
    .progress-bar {
      width: 100%;
      height: 100%;
      background: #fff;
    }

    /* Header */
    .header {
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      font-size: 20px;
      cursor: pointer;
    }
    .profile-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #202c33;
    }
    .status-meta .title {
      font-size: 16px;
      font-weight: 500;
    }
    .status-meta .subtitle {
      font-size: 12px;
      color: #8696a0;
    }
    .header-menu {
      font-size: 18px;
      cursor: pointer;
    }

    /* Story Media Section */
    .media-container {
      flex: 1;
      position: relative;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .story-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Floating Pill Badge */
    .pill-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(32, 44, 51, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Bottom Sheet Viewers List */
    .viewers-sheet {
      height: 50%;
      background-color: #111b21;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }
    .sheet-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #202c33;
    }
    .view-count {
      font-size: 16px;
      font-weight: 500;
    }
    .sheet-actions {
      display: flex;
      gap: 16px;
      color: #aebac1;
    }

    /* List Items */
    .viewers-list {
      flex: 1;
      overflow-y: auto;
    }
    .viewer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
    }
    .viewer-item:active {
      background-color: #202c33;
    }
    .viewer-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .viewer-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #202c33;
    }
    .viewer-name {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .viewer-time {
      font-size: 13px;
      color: #8696a0;
    }
    .reply-icon {
      color: #8696a0;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="status-card">
    <!-- Progress Indicator -->
    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>

    <!-- Header Navigation -->
    <div class="header">
      <div class="header-left">
        <span class="back-btn">&larr;</span>
        <!-- صورة شخصية صاحب الستوري -->
        <img src="https://via.placeholder.com/100" class="profile-avatar" id="myAvatar" alt="Me">
        <div class="status-meta">
          <div class="title">My status</div>
          <div class="subtitle">Yesterday, 1:34 pm</div>
        </div>
      </div>
      <div class="header-menu">&#8942;</div>
    </div>

    <!-- Story Main Image -->
    <div class="media-container">
      <!-- ضع رابط صورة الستوري هنا -->
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600" class="story-image" id="storyImg" alt="Status Story">
      
      <div class="pill-badge">
        <span>See more statuses</span>
        <span>&rarr;</span>
      </div>
    </div>

    <!-- Viewers Bottom Sheet -->
    <div class="viewers-sheet">
      <div class="sheet-header">
        <!-- عدد المشاهدات المطلوب (324) -->
        <div class="view-count" id="viewCount">Viewed by 324</div>
        <div class="sheet-actions">
          <span>&#128247;</span>
          <span>&#8942;</span>
        </div>
      </div>

      <!-- قائمة الأشخاص -->
      <div class="viewers-list" id="viewersList">
        <!-- يتم إدراج الأشخاص عبر JavaScript -->
      </div>
    </div>
  </div>

  <script>
    // بيانات الأشخاص اللذين رأوا الستوري (يمكنك تعديل الأسماء والتوقيت ورابط الصور هنا)
    const viewersData = [
      { name: "Sin Ca", time: "Yesterday, 6:35 pm", avatar: "https://i.pravatar.cc/150?img=11" },
      { name: "A Eltrabily", time: "Yesterday, 5:49 pm", avatar: "https://i.pravatar.cc/150?img=12" },
      { name: "Hamed", time: "Yesterday, 5:10 pm", avatar: "https://i.pravatar.cc/150?img=13" },
      { name: "Sick", time: "Yesterday, 2:06 pm", avatar: "https://i.pravatar.cc/150?img=14" },
      { name: "Mika", time: "Yesterday, 1:58 pm", avatar: "https://i.pravatar.cc/150?img=15" },
      { name: "Youssef", time: "Yesterday, 1:12 pm", avatar: "https://i.pravatar.cc/150?img=33" },
      { name: "Omar Nabil", time: "Yesterday, 12:45 pm", avatar: "https://i.pravatar.cc/150?img=60" }
    ];

    // توليد عناصر القائمة تلقائياً
    const container = document.getElementById('viewersList');
    
    viewersData.forEach(person => {
      const item = document.createElement('div');
      item.className = 'viewer-item';
      item.innerHTML = `
        <div class="viewer-info">
          <img src="${person.avatar}" class="viewer-avatar" alt="${person.name}">
          <div>
            <div class="viewer-name">${person.name}</div>
            <div class="viewer-time">${person.time}</div>
          </div>
        </div>
        <div class="reply-icon">&#128172;</div>
      `;
      container.appendChild(item);
    });
  </script>
</body>
</html>
