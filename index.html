<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Status Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b141a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Container replicating mobile screen */
    .status-card {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      max-height: 870px;
      background-color: #111b21;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      color: #e9edef;
    }

    /* Top Progress Bar */
    .progress-container {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      height: 2px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      z-index: 10;
    }
    .progress-bar {
      width: 100%;
      height: 100%;
      background: #fff;
    }

    /* Header */
    .header {
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      font-size: 20px;
      cursor: pointer;
      color: #fff;
    }
    .profile-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #202c33;
    }
    .status-meta .title {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
    }
    .status-meta .subtitle {
      font-size: 12px;
      color: #8696a0;
    }
    .header-menu {
      font-size: 18px;
      cursor: pointer;
      color: #fff;
    }

    /* Story Media Section */
    .media-container {
      flex: 1;
      position: relative;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: 52%;
    }
    .story-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Floating Pill Badge */
    .pill-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(32, 44, 51, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.1);
      color: #e9edef;
      white-space: nowrap;
    }

    /* Viewers Bottom Sheet */
    .viewers-sheet {
      flex: 1;
      background-color: #111b21;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
    }
    .sheet-header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #202c33;
    }
    .view-stats {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 500;
      color: #e9edef;
    }
    .likes-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #202c33;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 13px;
    }
    .sheet-actions {
      display: flex;
      gap: 18px;
      color: #8696a0;
      align-items: center;
    }
    .sheet-actions svg {
      cursor: pointer;
    }

    /* List Items */
    .viewers-list {
      flex: 1;
      overflow-y: auto;
    }
    .viewer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
    }
    .viewer-item:active {
      background-color: #202c33;
    }
    .viewer-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .viewer-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #202c33;
    }
    .viewer-name {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 2px;
      color: #e9edef;
    }
    .viewer-time {
      font-size: 13px;
      color: #8696a0;
    }
    .viewer-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body>

  <div class="status-card">
    <!-- Progress Indicator -->
    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>

    <!-- Header Navigation -->
    <div class="header">
      <div class="header-left">
        <span class="back-btn">&larr;</span>
        <!-- ضع صورة ملفك الشخصي هنا -->
        <img src="YOUR_PROFILE_AVATAR.jpg" class="profile-avatar" id="myAvatar" alt="Me">
        <div class="status-meta">
          <div class="title">My status</div>
          <div class="subtitle">Yesterday, 1:34 pm</div>
        </div>
      </div>
      <div class="header-menu">&#8942;</div>
    </div>

    <!-- Story Main Image -->
    <div class="media-container">
      <!-- ضع رابط أو اسم صورة الستوري الخاصة بك هنا -->
      <img src="YOUR_STORY_IMAGE.jpg" class="story-image" id="storyImg" alt="Status Story">
      
      <div class="pill-badge">
        <span>See more statuses</span>
        <span>&rarr;</span>
      </div>
    </div>

    <!-- Viewers Bottom Sheet -->
    <div class="viewers-sheet">
      <div class="sheet-header">
        <div class="view-stats">
          <span id="viewCount">Viewed by 324</span>
          <div class="likes-badge">
            <!-- أيقونة القلب الأخضر SVG -->
            <svg viewBox="0 0 24 24" width="16" height="16" fill="#00a884">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span style="color: #e9edef;">267</span>
          </div>
        </div>
        <div class="sheet-actions">
          <!-- أيقونة الكاميرا SVG -->
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#8696a0">
            <path d="M4 6h2l2-2h8l2 2h2a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm8 13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0-8c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z"/>
          </svg>
          <!-- زر الثلاث نقاط -->
          <span>&#8942;</span>
        </div>
      </div>

      <!-- قائمة الأشخاص -->
      <div class="viewers-list" id="viewersList">
        <!-- يتم إدراج الأشخاص تلقائياً عبر الجافاسكريبت -->
      </div>
    </div>
  </div>

  <script>
    // بيانات الأشخاص (يمكنك تعديل الأسماء، التوقيت، روابط الصور، وهل قاموا بالإعجاب أم لا liked: true/false)
    const viewersData = [
      { name: "Sin Ca", time: "Yesterday, 6:35 pm", avatar: "path/to/image1.jpg", liked: true },
      { name: "A Eltrabily", time: "Yesterday, 5:49 pm", avatar: "path/to/image2.jpg", liked: true },
      { name: "Hamed", time: "Yesterday, 5:10 pm", avatar: "path/to/image3.jpg", liked: false },
      { name: "Sick", time: "Yesterday, 2:06 pm", avatar: "path/to/image4.jpg", liked: true },
      { name: "Mika", time: "Yesterday, 1:58 pm", avatar: "path/to/image5.jpg", liked: false },
      { name: "Youssef", time: "Yesterday, 1:12 pm", avatar: "path/to/image6.jpg", liked: true },
      { name: "Omar Nabil", time: "Yesterday, 12:45 pm", avatar: "path/to/image7.jpg", liked: true }
    ];

    const container = document.getElementById('viewersList');
    
    viewersData.forEach(person => {
      const item = document.createElement('div');
      item.className = 'viewer-item';
      
      // أيقونة القلب الأخضر تظهر إذا كان الشخص قد وضع إعجاباً
      const heartSvg = person.liked ? `
        <svg viewBox="0 0 24 24" width="18" height="18" fill="#00a884">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>` : '';

      // أيقونة المحادثة (الرد) كـ SVG مطابقة لواتساب
      const chatSvg = `
        <svg viewBox="0 0 24 24" width="18" height="18" fill="#8696a0">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14l4-4h12c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
        </svg>`;

      item.innerHTML = `
        <div class="viewer-info">
          <img src="${person.avatar}" class="viewer-avatar" alt="${person.name}">
          <div>
            <div class="viewer-name">${person.name}</div>
            <div class="viewer-time">${person.time}</div>
          </div>
        </div>
        <div class="viewer-actions">
          ${heartSvg}
          ${chatSvg}
        </div>
      `;
      container.appendChild(item);
    });
  </script>
</body>
</html>
