<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Status Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b141a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Container replicating mobile screen */
    .status-card {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      max-height: 870px;
      background-color: #111b21;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      color: #e9edef;
    }

    /* Top Progress Bar */
    .progress-container {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      height: 2px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      z-index: 10;
    }
    .progress-bar {
      width: 100%;
      height: 100%;
      background: #ffffff;
    }

    /* Header */
    .header {
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      font-size: 22px;
      cursor: pointer;
      color: #ffffff;
    }
    .profile-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #202c33;
      border: 2px solid #008069;
    }
    .status-meta .title {
      font-size: 16px;
      font-weight: 500;
      color: #ffffff;
    }
    .status-meta .subtitle {
      font-size: 12px;
      color: #8696a0;
    }
    .header-menu {
      font-size: 20px;
      cursor: pointer;
      color: #ffffff;
    }

    /* Story Media Section */
    .media-container {
      width: 100%;
      height: 42%;
      position: relative;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .story-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Floating Pill Badge */
    .pill-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(32, 44, 51, 0.9);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.1);
      color: #e9edef;
      white-space: pointer;
    }

    /* Viewers Bottom Sheet (منخفضة بشكل منسق) */
    .viewers-sheet {
      flex: 1;
      background-color: #111b21;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.8);
      margin-top: -12px; /* تنزيل البطاقة قليلاً لتتداخل بشكل جميل مع الستوري */
    }
    .sheet-header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222d34;
      position: relative;
    }
    .view-count-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .view-count {
      font-size: 15px;
      font-weight: 500;
      color: #e9edef;
    }
    .likes-count-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      color: #e9edef;
      font-weight: 500;
    }
    .sheet-actions {
      display: flex;
      gap: 16px;
      align-items: center;
      position: relative;
    }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: #8696a0;
    }
    .icon-btn:hover {
      color: #e9edef;
    }

    /* Popup Card Menu (أيقونات فقط بدون كتابة) */
    .popup-menu {
      position: absolute;
      top: -65px;
      right: 0;
      background-color: #233138;
      border-radius: 12px;
      padding: 8px 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.08);
      display: none;
      align-items: center;
      gap: 14px;
      z-index: 100;
    }
    .popup-menu.active {
      display: flex;
    }
    .popup-item {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      color: #8696a0;
      transition: color 0.2s;
    }
    .popup-item:hover {
      color: #008069;
    }

    /* List Items & Scroll (تفعيل السكرول لجميع المشاهدين) */
    .viewers-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #222d34 transparent;
      max-height: 350px;
    }
    .viewers-list::-webkit-scrollbar {
      width: 4px;
    }
    .viewers-list::-webkit-scrollbar-thumb {
      background-color: #222d34;
      border-radius: 10px;
    }

    .viewer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      transition: background 0.2s;
    }
    .viewer-item:active {
      background-color: #202c33;
    }
    .viewer-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Status Segmented Ring (دائرة مقطعة تشير إلى عدة حالات/قصص للشخص) */
    .avatar-wrapper {
      position: relative;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      /* حلقة مقطعة باللون الأخضر غير الساطع تدل على تعدد الستوري */
      border: 2px dashed #008069;
      padding: 2px;
    }
    .viewer-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #202c33;
    }

    .viewer-name {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 2px;
      color: #e9edef;
    }
    .viewer-time {
      font-size: 12px;
      color: #8696a0;
    }
    .viewer-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
  </style>
</head>
<body>

  <div class="status-card">
    <!-- Progress Indicator -->
    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>

    <!-- Header Navigation -->
    <div class="header">
      <div class="header-left">
        <span class="back-btn">&larr;</span>
        <img src="my-avatar.jpg" class="profile-avatar" id="myAvatar" alt="Me">
        <div class="status-meta">
          <div class="title">My status</div>
          <div class="subtitle">Yesterday, 1:34 pm</div>
        </div>
      </div>
      <div class="header-menu">&#8942;</div>
    </div>

    <!-- Story Main Image -->
    <div class="media-container">
      <img src="story-image.jpg" class="story-image" id="storyImg" alt="Status Story">
      
      <div class="pill-badge">
        <span>See more statuses</span>
        <span>&rarr;</span>
      </div>
    </div>

    <!-- Viewers Bottom Sheet -->
    <div class="viewers-sheet">
      <div class="sheet-header">
        <div class="view-count-area">
          <div class="view-count" id="viewCount">Viewed by 326</div>
          <div class="likes-count-badge">
            <span>267</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="#008069">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </div>
        </div>
        <div class="sheet-actions">
          <!-- Facebook Icon -->
          <button class="icon-btn" title="Facebook">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="#8696a0">
              <path d="M12 2.04c-5.56 0-10 4.44-10 10 0 5.02 3.66 9.16 8.44 9.88v-6.99h-2.54v-2.89h2.54v-2.21c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.19 2.23.19v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.45 2.89h-2.33v6.98c4.78-.72 8.44-4.86 8.44-9.88 0-5.56-4.44-10-10-10z"/>
            </svg>
          </button>
          <!-- Instagram Icon -->
          <button class="icon-btn" title="Instagram">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="#8696a0">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
          </button>

          <!-- Three Dots Menu Button -->
          <button class="icon-btn" id="menuToggleBtn" title="More options">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="#8696a0">
              <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
          </button>

          <!-- Popup Card Menu (أيقونات فقط بدون نصوص) -->
          <div class="popup-menu" id="popupMenu">
            <!-- IP Icon -->
            <button class="popup-item" title="IP Info">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="#008069"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            </button>
            <!-- Earth Icon -->
            <button class="popup-item" title="Network">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="#8696a0"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            </button>
            <!-- Phone Icon -->
            <button class="popup-item" title="Mobile View">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="#8696a0"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
            </button>
            <!-- Computer Icon -->
            <button class="popup-item" title="Desktop">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="#8696a0"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
            </button>
          </div>

        </div>
      </div>

      <!-- قائمة المشاهدين مع إمكانية السكرول لرؤيتهم جميعاً -->
      <div class="viewers-list" id="viewersList">
        <!-- يتم إدراج المشاهدين تلقائياً عبر الجافاسكريبت -->
      </div>
    </div>
  </div>

  <script>
    const viewersData = [
      { name: "Sin Ca", time: "Yesterday, 6:35 pm", avatar: "viewer1.jpg", liked: true },
      { name: "A Eltrabily", time: "Yesterday, 5:49 pm", avatar: "viewer2.jpg", liked: true },
      { name: "Hamed", time: "Yesterday, 5:10 pm", avatar: "viewer3.jpg", liked: false },
      { name: "Sick", time: "Yesterday, 2:06 pm", avatar: "viewer4.jpg", liked: true },
      { name: "Mika", time: "Yesterday, 1:58 pm", avatar: "viewer5.jpg", liked: false },
      { name: "Youssef", time: "Yesterday, 1:12 pm", avatar: "viewer6.jpg", liked: true },
      { name: "Omar Nabil", time: "Yesterday, 12:45 pm", avatar: "viewer7.jpg", liked: true },
      { name: "Aya Mohamed", time: "Yesterday, 11:30 am", avatar: "viewer8.jpg", liked: true },
      { name: "Khaled Ali", time: "Yesterday, 10:15 am", avatar: "viewer1.jpg", liked: false },
      { name: "Sara Ahmed", time: "Yesterday, 9:00 am", avatar: "viewer2.jpg", liked: true }
    ];

    const container = document.getElementById('viewersList');
    
    viewersData.forEach(person => {
      const item = document.createElement('div');
      item.className = 'viewer-item';
      
      const heartSvg = person.liked ? `
        <svg viewBox="0 0 24 24" width="18" height="18" fill="#008069">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>` : '';

      const chatSvg = `
        <svg viewBox="0 0 24 24" width="19" height="19" fill="#8696a0">
          <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
        </svg>`;

      item.innerHTML = `
        <div class="viewer-info">
          <div class="avatar-wrapper">
            <img src="${person.avatar}" class="viewer-avatar" alt="${person.name}">
          </div>
          <div>
            <div class="viewer-name">${person.name}</div>
            <div class="viewer-time">${person.time}</div>
          </div>
        </div>
        <div class="viewer-actions">
          ${heartSvg}
          ${chatSvg}
        </div>
      `;
      container.appendChild(item);
    });

    // تفاعل إظهار وإخفاء القائمة عند الضغط على زر الثلاث نقاط
    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const popupMenu = document.getElementById('popupMenu');

    menuToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      popupMenu.classList.toggle('active');
    });

    window.addEventListener('click', () => {
      if (popupMenu.classList.contains('active')) {
        popupMenu.classList.remove('active');
      }
    });
  </script>
</body>
</html>
